name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile
      - run: bun run fmt:check

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile
      - run: bun run build
        env:
          ELO_PUBLISHER_ID: ci-publisher
          ELO_AD_UNIT_ID: ci-android
      - name: Check packaged SDK attribution and environment files
        run: |
          for file in LICENSE NOTICE; do
            unzip -p plugin.zip "licenses/elo/$file" | cmp - "node_modules/@elo-ads/web-sdk/$file"
          done
          if unzip -Z1 plugin.zip | grep -Eq '(^|/)\.env($|\.)'; then exit 1; fi

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile
      - run: bun run test
