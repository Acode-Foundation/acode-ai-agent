name: Publish to Acode

# Bump `version` in plugin.json (and package.json), add the release to changelogs.md,
# then publish a GitHub release tagged with that version (v0.2.2 or 0.2.2).
on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: acode-store
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check the release tag matches plugin.json
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(jq -r .version plugin.json)
          if [ "${TAG#v}" != "$version" ]; then
            echo "::error::Release tag $TAG does not match plugin.json version $version."
            exit 1
          fi

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile
      - run: bun run test
      - name: Build the release plugin
        env:
          ELO_PUBLISHER_ID: ${{ vars.ELO_PUBLISHER_ID }}
          ELO_AD_UNIT_ID: ${{ vars.ELO_AD_UNIT_ID }}
          ELO_IOS_AD_UNIT_ID: ${{ vars.ELO_IOS_AD_UNIT_ID }}
        run: |
          if [[ -z "${ELO_PUBLISHER_ID//[[:space:]]/}" || -z "${ELO_AD_UNIT_ID//[[:space:]]/}" ]]; then
            echo "::error::Configure the public Android Elo identifiers for the acode-store release."
            exit 1
          fi
          bun run build

      - id: publish
        uses: Acode-Foundation/publish-plugin@v1
        with:
          api-key: ${{ secrets.ACODE_API_KEY }}

      - name: Summary
        env:
          VERSION: ${{ steps.publish.outputs.version }}
          RESULT: ${{ steps.publish.outputs.result }}
          MESSAGE: ${{ steps.publish.outputs.message }}
        run: |
          {
            echo "### Acode AI Agent $VERSION: $RESULT"
            echo
            echo "$MESSAGE"
          } >> "$GITHUB_STEP_SUMMARY"
